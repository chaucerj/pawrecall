<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="PawRecall">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2140"/>
      <stop offset="1" stop-color="#3A2E5C"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- recall loop -->
  <path d="M 341 119 A 170 170 0 1 1 171 119" fill="none" stroke="#FFB86B" stroke-width="18" stroke-linecap="round"/>
  <path d="M 199 102 L 172 131 L 163 107 Z" fill="#FFB86B"/>
