<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="PawRecall — every conversation leaves a print. Follow it back.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2140"/>
      <stop offset="1" stop-color="#3A2E5C"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="48" fill="url(#bg)"/>
  <!-- paw mark with recall loop (scaled icon) -->
  <g transform="translate(64,36) scale(0.485)">
    <path d="M 341 119 A 170 170 0 1 1 171 119" fill="none" stroke="#FFB86B" stroke-width="18" stroke-linecap="round"/>
    <path d="M 199 102 L 172 131 L 163 107 Z" fill="#FFB86B"/>
    <g fill="#FFF7EC">
      <ellipse cx="256" cy="300" rx="80" ry="62"/>
      <ellipse cx="163" cy="222" rx="28" ry="38" transform="rotate(-20 163 222)"/>
      <ellipse cx="223" cy="192" rx="28" ry="40" transform="rotate(-7 223 192)"/>
      <ellipse cx="289" cy="192" rx="28" ry="40" transform="rotate(7 289 192)"/>
      <ellipse cx="349" cy="222" rx="28" ry="38" transform="rotate(20 349 222)"/>
    </g>
  </g>
  <!-- trailing prints -->
  <g fill="#FFF7EC" opacity="0.18">
    <ellipse cx="310" cy="248" rx="16" ry="12"/>
    <circle cx="295" cy="226" r="6"/>
    <circle cx="312" cy="219" r="6"/>
    <circle cx="329" cy="226" r="6"/>
  </g>
  <text x="392" y="168" font-family="Poppins, 'Avenir Next', 'Segoe UI', sans-serif" font-size="104" font-weight="800">
    <tspan fill="#FFB86B">Paw</tspan><tspan fill="#FFF7EC">Recall</tspan>
  </text>
  <text x="398" y="234" font-family="'Avenir Next', 'Segoe UI', sans-serif" font-size="32" fill="#B9B4DE">Every conversation leaves a print. Follow it back.</text>
</svg>
